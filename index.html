<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SalesForce AI Trainer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      html {
        scroll-behavior: smooth;
      }
      body {
        font-family: "Inter", sans-serif;
        background-color: #f0f4ff;
      }

      /* Animation for background blobs */
      @keyframes blob {
        0% {
          transform: translate(0px, 0px) scale(1);
        }
        33% {
          transform: translate(30px, -50px) scale(1.1);
        }
        66% {
          transform: translate(-20px, 20px) scale(0.9);
        }
        100% {
          transform: translate(0px, 0px) scale(1);
        }
      }
      .animate-blob {
        animation: blob 7s infinite;
      }
      .animation-delay-2000 {
        animation-delay: 2s;
      }
      .animation-delay-4000 {
        animation-delay: 4s;
      }

      /* Blur-In Scale Animation */
      @keyframes blur-in-scale {
        0% {
          opacity: 0;
          transform: scale(0.95);
          filter: blur(10px);
        }
        100% {
          opacity: 1;
          transform: scale(1);
          filter: blur(0);
        }
      }
      .animate-blur-in {
        animation: blur-in-scale 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      /* Slide Up Fade */
      @keyframes slide-up-fade {
        0% {
          opacity: 0;
          transform: translateY(20px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .animate-slide-up {
        animation: slide-up-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        opacity: 0; /* Start hidden */
      }

      /* Scale Up Fade */
      @keyframes scale-up-fade {
        0% {
          opacity: 0;
          transform: scale(0.9) translateY(10px);
        }
        100% {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }
      .animate-scale-up {
        animation: scale-up-fade 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      }

      /* Fade In */
      @keyframes fade-in {
        0% {
          opacity: 0;
        }
        100% {
          opacity: 1;
        }
      }
      .animate-fade-in {
        animation: fade-in 0.5s ease-out forwards;
      }

      /* Stagger delays */
      .delay-100 {
        animation-delay: 100ms;
      }
      .delay-200 {
        animation-delay: 200ms;
      }
      .delay-300 {
        animation-delay: 300ms;
      }
      .delay-400 {
        animation-delay: 400ms;
      }
      .delay-500 {
        animation-delay: 500ms;
      }

      /* Glassmorphism utilities */
      .glass-panel {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.5);
      }

      .glass-card {
        background: rgba(255, 255, 255, 0.6);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.6);
        box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }

      /* Hide Scrollbar util */
      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }
      .scrollbar-hide {
        -ms-overflow-style: none; /* IE and Edge */
        scrollbar-width: none; /* Firefox */
      }

      /* Theme Variables */
      :root {
        --color-primary: 79 70 229; /* indigo-600 rgb */
        --color-primary-dark: 49 46 129; /* indigo-900 rgb */
        --color-primary-light: 238 242 255; /* indigo-50 rgb */
        --color-highlight: 16 185 129; /* emerald-500 rgb */
        --color-gradient-from: 79 70 229; /* indigo-600 */
        --color-gradient-to: 59 130 246; /* blue-500 */
      }

      .theme-pro {
        --color-primary: 59 0 255; /* Electric Indigo #3B00FF */
        --color-primary-dark: 26 0 128; /* Darker Indigo */
        --color-primary-light: 245 242 255;
        --color-highlight: 0 245 170; /* Neon Mint #00F5AA */
        --color-gradient-from: 59 0 255;
        --color-gradient-to: 0 245 170;
      }

      /* Global Theme Overrides for Tailwind classes */
      body .bg-indigo-600,
      body .bg-indigo-500 {
        background-color: rgb(var(--color-primary)) !important;
      }
      body .hover\:bg-indigo-700:hover,
      body .hover\:bg-indigo-600:hover,
      body .hover\:bg-indigo-500:hover {
        background-color: rgb(var(--color-primary-dark)) !important;
      }
      body .text-indigo-600,
      body .text-indigo-500 {
        color: rgb(var(--color-primary)) !important;
      }
      body .hover\:text-indigo-600:hover,
      body .hover\:text-indigo-500:hover {
        color: rgb(var(--color-primary)) !important;
      }
      body .border-indigo-600,
      body .border-indigo-500 {
        border-color: rgb(var(--color-primary)) !important;
      }
      body .hover\:border-indigo-300:hover,
      body .hover\:border-indigo-400:hover,
      body .hover\:border-indigo-200:hover {
        border-color: rgb(var(--color-primary)) !important;
      }

      body .bg-indigo-900 {
        background-color: rgb(var(--color-primary-dark)) !important;
      }
      body .text-indigo-900,
      body .hover\:text-indigo-700:hover {
        color: rgb(var(--color-primary-dark)) !important;
      }

      body .bg-indigo-50 {
        background-color: rgb(var(--color-primary-light)) !important;
      }
      body .hover\:bg-indigo-50:hover {
        background-color: rgb(var(--color-primary-light)) !important;
      }
      body .text-indigo-50 {
        color: rgb(var(--color-primary-light)) !important;
      }

      body .bg-emerald-500,
      body .bg-emerald-600 {
        background-color: rgb(var(--color-highlight)) !important;
      }
      body .text-emerald-500,
      body .text-emerald-600 {
        color: rgb(var(--color-highlight)) !important;
      }
      body .border-emerald-500,
      body .border-emerald-600 {
        border-color: rgb(var(--color-highlight)) !important;
      }

      body .bg-slate-900 {
        background-color: #0f172a !important;
      } /* Ensure dark stays dark */
      body .text-slate-900 {
        color: #0f172a !important;
      }

      /* Gradients overrides */
      body .from-indigo-600,
      body .from-indigo-500,
      body .from-blue-600,
      body .from-cyan-300 {
        --tw-gradient-from: #3b00ff var(--tw-gradient-from-position) !important;
        --tw-gradient-to: rgb(59 0 255 / 0) var(--tw-gradient-to-position) !important;
        --tw-gradient-stops:
          var(--tw-gradient-from), var(--tw-gradient-to) !important;
      }
      body .to-blue-500,
      body .to-blue-600,
      body .to-indigo-500,
      body .to-indigo-600,
      body .to-cyan-400,
      body .to-cyan-500 {
        --tw-gradient-to: #00d695 var(--tw-gradient-to-position) !important; /* Slightly darker than F5AA to prevent blending with white page bg */
      }
      body .from-emerald-500 {
        --tw-gradient-from: #00d695 var(--tw-gradient-from-position) !important;
        --tw-gradient-to: rgb(0 214 149 / 0) var(--tw-gradient-to-position) !important;
        --tw-gradient-stops:
          var(--tw-gradient-from), var(--tw-gradient-to) !important;
      }

      /* Make text gradients slightly less bright at the tail for readability against white backgrounds */
      body .text-transparent.bg-clip-text.to-blue-500,
      body .text-transparent.bg-clip-text.to-blue-600,
      body .text-transparent.bg-clip-text.to-indigo-500,
      body .text-transparent.bg-clip-text.to-indigo-600,
      body .text-transparent.bg-clip-text.to-cyan-400,
      body .text-transparent.bg-clip-text.to-cyan-500 {
        --tw-gradient-to: #008764 var(--tw-gradient-to-position) !important;
      }

      @keyframes bounce-x {
        0%,
        100% {
          transform: translateX(0);
          animation-timing-function: cubic-bezier(0.8, 0, 1, 1);
        }
        50% {
          transform: translateX(25%);
          animation-timing-function: cubic-bezier(0, 0, 0.2, 1);
        }
      }
      .animate-bounce-x {
        animation: bounce-x 1s infinite;
      }
      @keyframes gradient {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }
    </style>
  </head>
  <body class="text-slate-900 antialiased overflow-x-hidden">
    <div id="root"></div>
    <!-- CRITICAL FIX: Load the React App -->
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
